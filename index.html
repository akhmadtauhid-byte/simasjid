<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5132">
<title>SIMASJID - Rekap Keuangan Masjid</title>
<style>
:root{
  --g:#0f5132;--g2:#198754;--gs:#e6f2ec;--bg:#f3f6f4;--card:#ffffff;--tx:#17251d;--mut:#5b6b62;--line:#dfe7e2;
  --in:#198754;--out:#c2410c;--warn:#b45309;--warnbg:#fef3c7;--errbg:#fee2e2;--err:#b91c1c;--shadow:0 1px 3px rgba(15,40,28,.08);
}
@media (prefers-color-scheme:dark){
  :root{--g:#0b3d26;--g2:#3ea97a;--gs:#16302a;--bg:#0f1713;--card:#18231d;--tx:#e8f0eb;--mut:#9db0a5;--line:#28382f;
  --in:#4ade80;--out:#fb923c;--warn:#fbbf24;--warnbg:#3b2f0b;--errbg:#3f1515;--err:#fca5a5;--shadow:none}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:78px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.hidden{display:none!important}
header.top{background:linear-gradient(135deg,var(--g),#146c43);color:#fff;padding:14px 16px 16px;position:sticky;top:0;z-index:20}
header.top .nm{font-size:17px;font-weight:700;letter-spacing:.2px}
header.top .sub{font-size:12.5px;opacity:.85}
header.top .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
main{max-width:860px;margin:0 auto;padding:14px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h3{font-size:14px;color:var(--mut);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.big{font-size:28px;font-weight:800;letter-spacing:-.5px}
.mut{color:var(--mut)}.sm{font-size:13px}.xs{font-size:12px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
@media(min-width:640px){.g4{grid-template-columns:repeat(4,1fr)}}
.g4{grid-template-columns:1fr 1fr}
.grid>*{min-width:0}
@media(max-width:480px){.g3{grid-template-columns:1fr}.g3 .tile{display:flex;justify-content:space-between;align-items:center}.g3 .tile .v{margin-top:0}}
.tile{background:var(--gs);border-radius:12px;padding:10px 12px}
.tile .l{font-size:12px;color:var(--mut)}.tile .v{font-size:17px;font-weight:700;margin-top:2px}
.tile.wide{grid-column:1/-1}
.grp{font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px;display:flex;justify-content:space-between;gap:8px}
.grp b{color:var(--tx);text-transform:none;letter-spacing:0;font-size:14px}
.kl{display:flex;justify-content:space-between;gap:10px;padding:6px 0 6px 12px;border-bottom:1px solid var(--line);font-size:14px}
.sh{display:flex;justify-content:space-between;gap:10px;font-weight:700;margin-top:12px;padding-bottom:3px}
.rh{font-size:15px;font-weight:800;color:var(--g2);text-transform:uppercase;letter-spacing:.3px;margin:18px 0 4px;border-bottom:2px solid var(--g2);padding-bottom:3px}
.rp .rh{color:#000;border-color:#000;font-size:13px;margin:14px 0 4px}
table.rpt td.sub{padding-left:20px}
table.rpt tr.gh td{font-weight:700;background:var(--bg)}
table.rpt tr.sec td{font-weight:800;background:var(--g2);color:#fff}
.in{color:var(--in)}.out{color:var(--out)}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--g2);color:#fff;min-height:44px}
.btn.sec{background:var(--gs);color:var(--g2);border:1px solid var(--line)}
.btn.red{background:var(--err);color:#fff}
.btn.sm{padding:7px 12px;min-height:34px;font-size:13px}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px;color:var(--mut)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);min-height:44px}
textarea{min-height:70px;resize:vertical}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 4px;font-weight:600;cursor:pointer;min-height:44px}
.seg button.on{background:var(--g2);color:#fff;border-color:var(--g2)}
.list .it{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
.list .it:last-child{border-bottom:0}
.it .l1{font-weight:600}.it .l2{font-size:12.5px;color:var(--mut)}
.it .amt{font-weight:700;white-space:nowrap;text-align:right}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;background:var(--gs);color:var(--g2);font-weight:600;margin-right:4px}
.badge.b{background:var(--errbg);color:var(--err)}
.badge.w{background:var(--warnbg);color:var(--warn)}
.strike{text-decoration:line-through;opacity:.6}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;z-index:30;padding-bottom:env(safe-area-inset-bottom)}
nav.bar button{flex:1;min-width:0;border:0;background:none;padding:10px 0 9px;font-size:11px;font-weight:600;color:var(--mut);cursor:pointer;min-height:56px}
nav.bar button.on{color:var(--g2);box-shadow:inset 0 3px 0 var(--g2)}
nav.bar button svg{display:block;margin:0 auto 3px}
.fab{position:fixed;right:16px;bottom:78px;z-index:25;background:var(--g2);color:#fff;border:0;border-radius:99px;padding:14px 20px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer;min-height:48px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px 24px}
@media(min-width:640px){.modal{align-items:center}.modal .sheet{border-radius:18px}}
.sheet h3{font-size:18px;margin-bottom:4px;text-transform:none;color:var(--tx);letter-spacing:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#1f2937;color:#fff;padding:10px 16px;border-radius:10px;z-index:80;font-size:14px;max-width:90%}
.toast.err{background:var(--err)}
.alert{padding:10px 12px;border-radius:10px;background:var(--warnbg);color:var(--warn);font-size:13px;margin:8px 0}
.alert.err{background:var(--errbg);color:var(--err)}
.spin{position:fixed;inset:0;background:rgba(255,255,255,.35);z-index:90;display:flex;align-items:center;justify-content:center}
.spin i{width:38px;height:38px;border:4px solid var(--gs);border-top-color:var(--g2);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.chartwrap svg{width:100%;height:auto;max-height:230px;display:block}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.filters .full{grid-column:1/-1}
table.rpt{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
table.rpt th,table.rpt td{border:1px solid var(--line);padding:6px 8px;text-align:left}
table.rpt th{background:var(--gs)}
table.rpt td.n,table.rpt th.n{text-align:right;white-space:nowrap}
table.rpt tr.tot td{font-weight:700;background:var(--gs)}
.scroll{overflow-x:auto}
.center{text-align:center}
.login{max-width:380px;margin:40px auto 0}
.empty{text-align:center;color:var(--mut);padding:22px 0}
/* ---- cetak ---- */
#printArea{display:none}
.kw{border:2px solid #000;padding:18px 22px;color:#000;font-family:Georgia,"Times New Roman",serif;max-width:720px;margin:0 auto}
.kw h2{text-align:center;font-size:20px;letter-spacing:1px;margin:0}
.kw .hd{text-align:center;border-bottom:2px double #000;padding-bottom:8px;margin-bottom:12px}
.kw table{width:100%;border-collapse:collapse}
.kw td{padding:5px 4px;vertical-align:top;font-size:14px}
.kw .amt{border:2px solid #000;display:inline-block;padding:6px 16px;font-size:20px;font-weight:700;margin-top:10px}
.kw .ttd{display:flex;justify-content:flex-end;margin-top:22px;text-align:center;font-size:14px}
.rp{color:#000;font-family:Arial,Helvetica,sans-serif;font-size:12px}
.rp h2{text-align:center;margin:0;font-size:16px}.rp .hd{text-align:center;margin-bottom:10px;border-bottom:2px solid #000;padding-bottom:6px}
.rp table{width:100%;border-collapse:collapse;margin:6px 0 12px}
.rp th,.rp td{border:1px solid #000;padding:4px 6px}
.rp th{background:#e5e5e5}.rp .n{text-align:right;white-space:nowrap}
.rp tr.tot td{font-weight:700;background:#f0f0f0}
.rp tr.gh td{font-weight:700;background:#f7f7f7}
.rp tr.sec td{font-weight:800;background:#d9d9d9}
.rp td.sub{padding-left:16px}
.rp h3{margin:14px 0 4px;font-size:14px}
.rp h4{margin:12px 0 2px;font-size:13px}
.rp .sig{display:flex;justify-content:space-between;margin-top:30px;text-align:center}
.rp .sig div{width:40%}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;background:#fff;color:#000}
  body{background:#fff;padding:0}
  @page{margin:14mm}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<div id="modal" class="modal hidden"><div class="sheet" id="modalBody"></div></div>
<div id="busy" class="spin hidden"><i></i></div>
<div id="toast" class="toast hidden"></div>

<script>
/* =====================================================================
   SIMASJID - frontend. Ganti API_URL dengan URL Web App Apps Script Anda
   (berakhiran /exec). Contoh: https://script.google.com/macros/s/AKfy.../exec
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbxuzTXhbmbbLQW4A5zZMRKfmb8eBF4UD_KvIc3g2yzPVmR5lKzGBLAGw6-8bEQ2JNjb/exec';

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => 'Rp ' + Math.round(Number(n) || 0).toLocaleString('id-ID');
const BULAN = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const BLN3 = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const JENIS = ['Pendapatan','Sumbangan','Pengeluaran'];
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const tglID = iso => { if (!iso) return ''; const [y, m, d] = String(iso).slice(0, 10).split('-'); return `${+d} ${BULAN[+m - 1]} ${y}`; };
const isMasuk = t => t.Jenis !== 'Pengeluaran';
const kompak = n => { const a = Math.abs(n); return (n < 0 ? '-' : '') + (a >= 1e9 ? (a / 1e9).toFixed(1) + ' M' : a >= 1e6 ? (a / 1e6).toFixed(1).replace('.0', '') + ' jt' : a >= 1e3 ? Math.round(a / 1e3) + ' rb' : a); };

function terbilang(n) {
  n = Math.floor(n);
  const s = ['', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
  const t = n => {
    n = Math.floor(n);
    if (n < 12) return s[n];
    if (n < 20) return s[n - 10] + ' belas';
    if (n < 100) return s[Math.floor(n / 10)] + ' puluh' + (n % 10 ? ' ' + s[n % 10] : '');
    if (n < 200) return 'seratus' + (n % 100 ? ' ' + t(n % 100) : '');
    if (n < 1000) return s[Math.floor(n / 100)] + ' ratus' + (n % 100 ? ' ' + t(n % 100) : '');
    if (n < 2000) return 'seribu' + (n % 1000 ? ' ' + t(n % 1000) : '');
    if (n < 1e6) return t(Math.floor(n / 1000)) + ' ribu' + (n % 1000 ? ' ' + t(n % 1000) : '');
    if (n < 1e9) return t(Math.floor(n / 1e6)) + ' juta' + (n % 1e6 ? ' ' + t(n % 1e6) : '');
    if (n < 1e12) return t(Math.floor(n / 1e9)) + ' miliar' + (n % 1e9 ? ' ' + t(n % 1e9) : '');
    return t(Math.floor(n / 1e12)) + ' triliun' + (n % 1e12 ? ' ' + t(n % 1e12) : '');
  };
  return n === 0 ? 'nol' : t(n);
}

/* ------------------------- state ------------------------- */
const S = {
  token: null, user: null, cfg: {}, kategori: [], dana: [], trx: [], don: [],
  kas: { mode: 'bulan', bulan: todayISO().slice(0, 7), tahun: todayISO().slice(0, 4) },
  inv: [], invOk: true, invMeta: { kategori: [], kondisi: [], sumber: [] }, invF: { kat: '', kond: '', q: '' },
  tab: 'home', view: 'pub', pub: null,
  filter: { jenis: '', bulan: '', dana: '', q: '' },
  lap: { mode: 'bulan', bulan: todayISO().slice(0, 7), tahun: todayISO().slice(0, 4), from: todayISO().slice(0, 8) + '01', to: todayISO() },
  donQ: '', f: { jenis: 'Sumbangan' }
};
const canWrite = () => S.user && (S.user.role === 'admin' || S.user.role === 'bendahara');
const isAdmin = () => S.user && S.user.role === 'admin';

/* ------------------------- util UI ------------------------- */
function busy(on) { $('#busy').classList.toggle('hidden', !on); }
let toastT;
function toast(msg, err) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : '');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), err ? 4500 : 2500);
}
function openModal(html) { $('#modalBody').innerHTML = html; $('#modal').classList.remove('hidden'); }
function closeModal() { $('#modal').classList.add('hidden'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

async function api(action, payload) {
  if (!/^https:\/\//.test(API_URL)) throw new Error('API_URL belum diisi di index.html');
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ action, token: S.token }, payload || {})) });
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'SESI_HABIS') { logout(true); throw new Error('Sesi berakhir, silakan masuk lagi.'); }
    throw new Error(j.error);
  }
  return j.data;
}
async function run(fn) {
  busy(true);
  try { return await fn(); } catch (e) { toast(e.message || String(e), true); } finally { busy(false); }
}
function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function ssSet(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) { } }

/* ------------------------- kalkulasi ------------------------- */
const aktif = () => S.trx.filter(t => t.Status !== 'Batal');
/* Kas Umum = dana "Kas Umum". Kas Khusus (insidental) = semua dana lain: Pembangunan, Zakat, Qurban, dst. */
const KAS_UMUM = 'Kas Umum';
const isKhusus = d => d !== KAS_UMUM;
function khususList(danaArr) {
  const arr = danaArr || S.dana, pref = ['Wakaf & Pembangunan', 'Zakat', 'Qurban & Kegiatan'];
  return pref.filter(d => arr.includes(d)).concat(arr.filter(d => d !== KAS_UMUM && !pref.includes(d)));
}
function calc(from, to) {
  const res = {};
  S.dana.forEach(d => res[d] = { awal: Number(S.cfg['saldo_awal:' + d] || 0), masuk: 0, keluar: 0 });
  const kat = { Pendapatan: {}, Sumbangan: {}, Pengeluaran: {} }, kd = {};
  aktif().forEach(t => {
    const r = res[t.Dana] || (res[t.Dana] = { awal: 0, masuk: 0, keluar: 0 });
    if (from && t.Tanggal < from) { r.awal += isMasuk(t) ? t.Nominal : -t.Nominal; return; }
    if (to && t.Tanggal > to) return;
    if (isMasuk(t)) r.masuk += t.Nominal; else r.keluar += t.Nominal;
    kat[t.Jenis][t.Kategori] = (kat[t.Jenis][t.Kategori] || 0) + t.Nominal;
    const k = kd[t.Dana] || (kd[t.Dana] = { Pendapatan: {}, Sumbangan: {}, Pengeluaran: {} });
    k[t.Jenis][t.Kategori] = (k[t.Jenis][t.Kategori] || 0) + t.Nominal;
  });
  const tot = { awal: 0, masuk: 0, keluar: 0, akhir: 0 };
  Object.keys(res).forEach(d => { const r = res[d]; r.akhir = r.awal + r.masuk - r.keluar; tot.awal += r.awal; tot.masuk += r.masuk; tot.keluar += r.keluar; tot.akhir += r.akhir; });
  const jen = { Pendapatan: 0, Sumbangan: 0, Pengeluaran: 0 };
  Object.keys(kat).forEach(j => Object.values(kat[j]).forEach(v => jen[j] += v));
  const sum = list => { const o = { awal: 0, masuk: 0, keluar: 0, akhir: 0 }; list.forEach(d => { const r = res[d]; if (r) { o.awal += r.awal; o.masuk += r.masuk; o.keluar += r.keluar; o.akhir += r.akhir; } }); return o; };
  const khusus = sum(Object.keys(res).filter(isKhusus));
  return { res, kat, kd, tot, jen, khusus, umum: res[KAS_UMUM] || { awal: 0, masuk: 0, keluar: 0, akhir: 0 } };
}
function bulanSeries(n) {
  const out = []; const d = new Date(); let y = d.getFullYear(), m = d.getMonth() + 1;
  for (let i = 0; i < n; i++) { out.unshift({ key: y + '-' + String(m).padStart(2, '0'), masuk: 0, keluar: 0 }); m--; if (!m) { m = 12; y--; } }
  aktif().forEach(t => { const b = out.find(x => x.key === t.Tanggal.slice(0, 7)); if (b) { if (isMasuk(t)) b.masuk += t.Nominal; else b.keluar += t.Nominal; } });
  return out;
}
function chartSVG(series) {
  const W = 340, H = 170, pl = 40, pb = 22, pt = 8, pr = 6;
  const max = Math.max(1, ...series.map(s => Math.max(s.masuk, s.keluar)));
  const step = Math.pow(10, Math.floor(Math.log10(max))); let top = Math.ceil(max / step) * step; if (top / step < 2) top = step * 2;
  const iw = W - pl - pr, ih = H - pt - pb, bw = iw / series.length;
  let g = '';
  for (let i = 0; i <= 3; i++) {
    const v = top * i / 3, y = pt + ih - (ih * i / 3);
    g += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 5}" y="${y + 3}" text-anchor="end" font-size="9" fill="var(--mut)">${kompak(v)}</text>`;
  }
  series.forEach((s, i) => {
    const x0 = pl + i * bw, w = bw * .32, hm = ih * s.masuk / top, hk = ih * s.keluar / top;
    const m = +s.key.slice(5) - 1;
    g += `<rect x="${x0 + bw * .12}" y="${pt + ih - hm}" width="${w}" height="${Math.max(hm, 0)}" rx="2" fill="var(--in)"><title>${BULAN[m]}: pemasukan ${rp(s.masuk)}</title></rect>`;
    g += `<rect x="${x0 + bw * .12 + w + 2}" y="${pt + ih - hk}" width="${w}" height="${Math.max(hk, 0)}" rx="2" fill="var(--out)"><title>${BULAN[m]}: pengeluaran ${rp(s.keluar)}</title></rect>`;
    g += `<text x="${x0 + bw / 2}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--mut)">${BLN3[m]}</text>`;
  });
  return `<div class="chartwrap"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik pemasukan dan pengeluaran per bulan">${g}</svg><div class="legend"><span><i style="background:var(--in)"></i>Pemasukan</span><span><i style="background:var(--out)"></i>Pengeluaran</span></div></div>`;
}

/* ------------------------- init & auth ------------------------- */
async function init() {
  if (!/^https:\/\//.test(API_URL)) { $('#app').innerHTML = `<main><div class="card"><h3>Belum dikonfigurasi</h3><p>Buka <b>index.html</b>, cari baris <code>const API_URL</code> lalu ganti dengan URL Web App Apps Script Anda (berakhiran <code>/exec</code>).</p></div></main>`; return; }
  S.token = ssGet('sm_token');
  try { S.user = JSON.parse(ssGet('sm_user') || 'null'); } catch (e) { S.user = null; }
  busy(true);
  try {
    if (S.token && S.user) { await loadData(); S.view = 'app'; }
    else { S.pub = await api('publik'); S.view = 'pub'; }
  } catch (e) { if (S.view !== 'app') { S.view = 'login'; } toast(e.message, true); }
  busy(false);
  render();
}
async function loadData() {
  const d = await api('data');
  S.cfg = d.cfg; S.kategori = d.kategori; S.dana = d.dana; S.user = d.user;
  S.trx = d.trx.map(t => Object.assign(t, { Nominal: Number(t.Nominal) }));
  S.don = d.don;
  S.invOk = d.invOk !== false;
  S.invMeta = d.invMeta || S.invMeta;

/* ---- transaksi ---- */

function katOf(jenis) { return S.kategori.filter(k => k.Jenis === jenis); }

    <label>Metode</label><select id="fMet">${['Tunai', 'Transfer', 'QRIS'].map(m => `<option ${tt.Metode === m ? 'selected' : ''}>${m}</option>`).join('')}</select>
    <label>Keterangan</label><textarea id="fKet">${esc(tt.Keterangan)}</textarea>
    <div id="fWarn"></div>
    <div class="grid g2" style="margin-top:14px"><button class="btn sec" onclick="closeModal()">Batal</button><button class="btn" onclick="saveTrx()">Simpan</button></div>`);
  buildKat(tt.Kategori);
}
function buildKat(sel) {
  const ks = katOf(S.f.jenis);
  $('#fKat').innerHTML = ks.map(k => `<option ${k.Kategori === sel ? 'selected' : ''}>${esc(k.Kategori)}</option>`).join('');

function setJenis(j) { S.f.jenis = j; document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.textContent === j)); buildKat(''); }
function updDana() {
  const k = katOf(S.f.jenis).find(x => x.Kategori === $('#fKat').value);
  $('#fDana').textContent = k ? (k.Dana === KAS_UMUM ? 'Dicatat pada: Kas Umum' : 'Dicatat pada: Kas Khusus → ' + k.Dana) : '';
}
function fmtNom(el) { const v = el.value.replace(/\D/g, ''); el.value = v ? Number(v).toLocaleString('id-ID') : ''; }
async function saveTrx() {
  const nominal = Number($('#fNom').value.replace(/\D/g, ''));
  if (!nominal) return toast('Nominal wajib diisi', true);
  const kat = katOf(S.f.jenis).find(x => x.Kategori === $('#fKat').value);
  if (!kat) return toast('Pilih kategori', true);
  if (S.f.jenis === 'Pengeluaran') {
    let saldo = calc(null, null).res[kat.Dana]?.akhir || 0;
    if (S.f.id) { const old = S.trx.find(x => x.ID === S.f.id); if (old && old.Dana === kat.Dana) saldo += old.Nominal; }
    if (nominal > saldo && !confirm(`Saldo dana "${kat.Dana}" hanya ${rp(saldo)}. Pengeluaran ini akan membuat saldo minus. Tetap simpan?`)) return;
  }
  const trx = { ID: S.f.id, Jenis: S.f.jenis, Tanggal: $('#fTgl').value, Kategori: kat.Kategori, Nominal: nominal, Pihak: $('#fPihak').value, Telepon: $('#fTel').value, Metode: $('#fMet').value, Keterangan: $('#fKet').value };
  await run(async () => {
    const r = await api(S.f.id ? 'trx_update' : 'trx_add', { trx });
    await loadData(); closeModal(); render(); toast('Tersimpan: ' + r.NoBukti);
    if (r.Jenis !== 'Pengeluaran' || S.f.id) showDetail(r.ID);

/* ---- detail, kuitansi, batal ---- */
function waLink(t) {
  const d = S.don.find(x => x.ID === t.DonaturID); if (!d || !d.Telepon) return '';
  let n = String(d.Telepon).replace(/[^\d]/g, ''); if (n.startsWith('0')) n = '62' + n.slice(1); if (!n) return '';

  return 'https://wa.me/' + n + '?text=' + encodeURIComponent(msg);

/* ---- laporan ---- */
function lapRange() {
  const l = S.lap;
  if (l.mode === 'bulan') { const [y, m] = l.bulan.split('-'); return { from: l.bulan + '-01', to: l.bulan + '-31', label: `Bulan ${BULAN[+m - 1]} ${y}` }; }
  if (l.mode === 'tahun') return { from: l.tahun + '-01-01', to: l.tahun + '-12-31', label: `Tahun ${l.tahun}` };
  return { from: l.from, to: l.to, label: `${tglID(l.from)} s.d. ${tglID(l.to)}` };
}
function reportHTML(print, rng, only) {
  const r = rng || lapRange(), c = calc(r.from, r.to), cf = S.cfg, cls = print ? 'rp' : '';
  const T = print ? '<table>' : '<table class="rpt">';
  const row = (lbl, v, o) => { o = o || {}; return `<tr class="${o.cls || ''}"><td class="${o.sub ? 'sub' : ''}"${v === undefined ? ' colspan="2"' : ''}>${lbl}</td>${v === undefined ? '' : `<td class="n">${rp(v)}</td>`}</tr>`; };
  const kosong = { Pendapatan: {}, Sumbangan: {}, Pengeluaran: {} };
  /* satu buku kas: Saldo Awal + I. PEMASUKAN (Pendapatan + Sumbangan) - II. PENGELUARAN = Saldo Akhir */
  const blok = (d, full) => {
    const x = c.res[d] || { awal: 0, masuk: 0, keluar: 0, akhir: 0 }, k = c.kd[d] || kosong;
    const urut = j => Object.entries(k[j]).sort((a, b) => b[1] - a[1]);
    const grp = j => {
      const e = urut(j);
      if (!e.length && !full) return '';
      const tot = e.reduce((a, [, v]) => a + v, 0);
      return row(j, undefined, { cls: 'gh' }) + (e.map(([n, v]) => row(esc(n), v, { sub: 1 })).join('') || row('Tidak ada', 0, { sub: 1 })) + row('Jumlah ' + j, tot, { cls: 'gh' });
    };
    const pem = grp('Pendapatan') + grp('Sumbangan') || row('Tidak ada pemasukan pada periode ini', undefined, { sub: 1 });
    const kel = urut('Pengeluaran').map(([n, v]) => row(esc(n), v, { sub: 1 })).join('') || row('Tidak ada pengeluaran pada periode ini', undefined, { sub: 1 });
    return `${T}<tr><th>Uraian</th><th class="n">Jumlah</th></tr>
      ${row('Saldo Awal', x.awal, { cls: 'tot' })}
      ${row('I. PEMASUKAN', undefined, { cls: 'sec' })}${pem}${row('TOTAL PEMASUKAN', x.masuk, { cls: 'tot' })}
      ${row('II. PENGELUARAN', undefined, { cls: 'sec' })}${kel}${row('TOTAL PENGELUARAN', x.keluar, { cls: 'tot' })}
      ${row('SALDO AKHIR', x.akhir, { cls: 'tot' })}</table>`;
  };
  const rr = (lbl, x, o) => { o = o || {}; return `<tr class="${o.cls || ''}"><td class="${o.sub ? 'sub' : ''}">${lbl}</td><td class="n">${rp(x.awal)}</td><td class="n">${rp(x.masuk)}</td><td class="n">${rp(x.keluar)}</td><td class="n">${rp(x.akhir)}</td></tr>`; };
  const kh = khususList(Object.keys(c.res));
  const umum = only === 'umum';
  const isi = umum ? `<div class="rh">Kas Umum</div>${blok(KAS_UMUM, true)}` : `<div class="rh">A. Kas Umum</div>${blok(KAS_UMUM, true)}
  <div class="rh">B. Kas Khusus (Insidental)</div>
  ${kh.map((d, i) => `<h4>${i + 1}. ${esc(d)}</h4>${blok(d, false)}`).join('') || '<p>Belum ada dana khusus.</p>'}
  <div class="rh">C. Rekapitulasi Seluruh Kas</div>
  ${T}<tr><th>Kas</th><th class="n">Saldo Awal</th><th class="n">Pemasukan</th><th class="n">Pengeluaran</th><th class="n">Saldo Akhir</th></tr>
  ${rr('Kas Umum', c.umum)}${rr('Kas Khusus', c.khusus, { cls: 'gh' })}${kh.map(d => rr(esc(d), c.res[d], { sub: 1 })).join('')}
  ${rr('TOTAL SELURUH KAS', c.tot, { cls: 'tot' })}</table>`;
  return `<div class="${cls}"><div class="hd"><h2>LAPORAN ${umum ? 'KAS UMUM' : 'KEUANGAN'} ${esc((cf.nama_masjid || '').toUpperCase())}</h2><div>${esc([cf.alamat, cf.kota].filter(Boolean).join(', '))}</div><div><b>Periode: ${esc(r.label)}</b></div></div>
  ${isi}
  ${print ? `<div class="sig"><div>Mengetahui,<br>Ketua DKM<br><br><br><br><b><u>${esc(cf.ketua_dkm || '..............')}</u></b></div><div>${esc(cf.kota || '')}${cf.kota ? ', ' : ''}${tglID(todayISO())}<br>Bendahara<br><br><br><br><b><u>${esc(cf.bendahara || '..............')}</u></b></div></div>` : ''}</div>`;
}

function cetakInv() {
  const list = invFiltered(), cf = S.cfg, nilai = list.reduce((a, x) => a + x.Nilai, 0), f = S.invF;
  const ket = [f.kat, f.kond, f.q ? 'cari: ' + f.q : ''].filter(Boolean).join(' · ');
  printHTML(`<div class="rp"><div class="hd"><h2>DAFTAR INVENTARIS ${esc((cf.nama_masjid || '').toUpperCase())}</h2><div>${esc([cf.alamat, cf.kota].filter(Boolean).join(', '))}</div><div><b>Per ${tglID(todayISO())}${ket ? ' (' + esc(ket) + ')' : ''}</b></div></div>
  <table><tr><th>No</th><th>Kode</th><th>Nama Barang</th><th>Kategori</th><th class="n">Jumlah</th><th>Kondisi</th><th>Lokasi</th><th class="n">Nilai (Rp)</th></tr>
  ${list.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.Kode)}</td><td>${esc(x.Nama)}</td><td>${esc(x.Kategori)}</td><td class="n">${x.Jumlah.toLocaleString('id-ID')} ${esc(x.Satuan)}</td><td>${esc(x.Kondisi)}</td><td>${esc(x.Lokasi)}</td><td class="n">${x.Nilai ? x.Nilai.toLocaleString('id-ID') : '-'}</td></tr>`).join('') || '<tr><td colspan="8">Belum ada barang</td></tr>'}
  <tr class="tot"><td colspan="7">TOTAL NILAI PEROLEHAN (${list.length} jenis barang)</td><td class="n">${nilai.toLocaleString('id-ID')}</td></tr></table>
  <div class="sig"><div>Mengetahui,<br>Ketua DKM<br><br><br><br><b><u>${esc(cf.ketua_dkm || '..............')}</u></b></div><div>${esc(cf.kota || '')}${cf.kota ? ', ' : ''}${tglID(todayISO())}<br>Bendahara<br><br><br><br><b><u>${esc(cf.bendahara || '..............')}</u></b></div></div></div>`);
}
function exportInv() {
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"';
  const csv = '﻿' + ['Kode', 'Nama', 'Kategori', 'Jumlah', 'Satuan', 'Kondisi', 'Lokasi', 'Tgl Perolehan', 'Sumber', 'Nilai', 'No Bukti', 'Keterangan'].join(',') + '\n' +
    invFiltered().map(x => [x.Kode, x.Nama, x.Kategori, x.Jumlah, x.Satuan, x.Kondisi, x.Lokasi, x.TglPerolehan, x.Sumber, x.Nilai, x.NoBukti, x.Keterangan].map(q).join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'inventaris-masjid-' + todayISO() + '.csv'; document.body.appendChild(a); a.click(); a.remove();
}

/* ---- pengaturan ---- */
function viewAtur() {
  const c = S.cfg;
  let h = `<div class="card"><h3>Akun</h3><div><b>${esc(S.user.nama)}</b> <span class="badge">${esc(S.user.role)}</span></div>
    <label>PIN lama</label><input id="pL" type="password" inputmode="numeric" maxlength="6"><label>PIN baru (6 digit)</label><input id="pB" type="password" inputmode="numeric" maxlength="6">
    <div class="grid g2" style="margin-top:12px"><button class="btn" onclick="ubahPin()">Ganti PIN</button><button class="btn sec" onclick="logout()">Keluar</button></div></div>`;
  if (!isAdmin()) return h;
  h += `<div class="card"><h3>Profil Masjid</h3>
    ${[['nama_masjid', 'Nama masjid'], ['alamat', 'Alamat'], ['kota', 'Kota (untuk tanda tangan)'], ['telepon', 'Telepon'], ['ketua_dkm', 'Ketua DKM'], ['bendahara', 'Bendahara']].map(([k, l]) => `<label>${l}</label><input data-cfg="${k}" value="${esc(c[k] || '')}">`).join('')}
    <label>Laporan publik (tanpa login)</label><select data-cfg="publik_aktif"><option value="ya" ${c.publik_aktif === 'ya' ? 'selected' : ''}>Tampilkan ke jamaah</option><option value="tidak" ${c.publik_aktif !== 'ya' ? 'selected' : ''}>Sembunyikan</option></select></div>
  <div class="card"><h3>Saldo Awal per Dana</h3><div class="xs mut">Isi saldo yang sudah ada sebelum mulai memakai sistem ini.</div>
    ${S.dana.map(d => `<label>${esc(d)}</label><input data-cfg="saldo_awal:${esc(d)}" inputmode="numeric" value="${Number(c['saldo_awal:' + d] || 0).toLocaleString('id-ID')}" oninput="fmtNom(this)">`).join('')}
    <button class="btn block" style="margin-top:14px" onclick="saveCfg()">Simpan Profil & Saldo Awal</button></div>
  <div class="card"><h3>Kategori</h3>${JENIS.map(j => `<div class="sm" style="margin:8px 0 2px"><b>${j}</b></div><div class="xs mut">${katOf(j).map(k => esc(k.Kategori) + ' → ' + esc(k.Dana)).join(' · ')}</div>`).join('')}
    <button class="btn sec block" style="margin-top:12px" onclick="formKat()">+ Tambah Kategori</button></div>
  <div class="card"><h3>Pengguna</h3><div id="userList" class="list"><div class="empty"><button class="btn sec sm" onclick="loadUsers()">Tampilkan daftar pengguna</button></div></div></div>`;
  return h;
}
async function ubahPin() { await run(async () => { await api('pin_ubah', { lama: $('#pL').value, baru: $('#pB').value }); $('#pL').value = ''; $('#pB').value = ''; toast('PIN berhasil diganti'); }); }
async function saveCfg() {
  const cfg = {}; document.querySelectorAll('[data-cfg]').forEach(el => { const k = el.dataset.cfg; cfg[k] = k.startsWith('saldo_awal:') ? Number(el.value.replace(/\D/g, '')) : el.value; });
  await run(async () => { await api('cfg_save', { cfg }); await loadData(); render(); toast('Pengaturan tersimpan'); });
}
function formKat() {
  openModal(`<h3>Tambah Kategori</h3><label>Jenis</label><select id="kJ">${JENIS.map(j => `<option>${j}</option>`).join('')}</select>
  <label>Nama kategori</label><input id="kN"><label>Dana (pilih atau ketik dana baru)</label><input id="kD" list="dlDana" value="Kas Umum"><datalist id="dlDana">${S.dana.map(d => `<option value="${esc(d)}">`).join('')}</datalist>
  <div class="grid g2" style="margin-top:14px"><button class="btn sec" onclick="closeModal()">Batal</button><button class="btn" onclick="saveKat()">Simpan</button></div>`);
}
async function saveKat() { await run(async () => { await api('kat_add', { jenis: $('#kJ').value, kategori: $('#kN').value, dana: $('#kD').value }); await loadData(); closeModal(); render(); toast('Kategori ditambahkan'); }); }
async function loadUsers() {
  await run(async () => {
    const u = await api('users'); S.users = u;
    $('#userList').innerHTML = u.map(x => `<div class="it" onclick="formUser('${esc(x.Username)}')"><div><div class="l1">${esc(x.Nama)}</div><div class="l2">${esc(x.Username)} · ${esc(x.Role)}</div></div><span class="badge ${x.Aktif === 'ya' ? '' : 'b'}">${x.Aktif === 'ya' ? 'Aktif' : 'Nonaktif'}</span></div>`).join('') +
      '<button class="btn sec block" style="margin-top:10px" onclick="formUser()">+ Tambah Pengguna</button>';
  });
}
function formUser(un) {
  const u = un ? (S.users || []).find(x => x.Username === un) : { Username: '', Nama: '', Role: 'bendahara', Aktif: 'ya' };
  openModal(`<h3>${un ? 'Ubah Pengguna' : 'Pengguna Baru'}</h3>
  <label>Username</label><input id="uU" value="${esc(u.Username)}" ${un ? 'disabled' : ''} autocapitalize="none"><label>Nama</label><input id="uN" value="${esc(u.Nama)}">
  <label>Role</label><select id="uR">${[['admin', 'admin — semua fitur'], ['bendahara', 'bendahara — input & laporan'], ['viewer', 'viewer — hanya melihat']].map(([v, l]) => `<option value="${v}" ${u.Role === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
  <label>PIN ${un ? '(kosongkan jika tidak diganti)' : '(6 digit)'}</label><input id="uP" inputmode="numeric" maxlength="6" type="password">
  <label>Status</label><select id="uA"><option value="ya" ${u.Aktif === 'ya' ? 'selected' : ''}>Aktif</option><option value="tidak" ${u.Aktif !== 'ya' ? 'selected' : ''}>Nonaktif</option></select>
  <div class="grid g2" style="margin-top:14px"><button class="btn sec" onclick="closeModal()">Batal</button><button class="btn" onclick="saveUser()">Simpan</button></div>`);
}
async function saveUser() {
  await run(async () => { await api('user_save', { user: { Username: $('#uU').value, Nama: $('#uN').value, Role: $('#uR').value, PIN: $('#uP').value, Aktif: $('#uA').value } }); closeModal(); toast('Pengguna tersimpan'); render(); });
}

init();
</script>
